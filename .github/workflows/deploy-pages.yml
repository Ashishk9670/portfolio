name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      # The A4 PDFs and contact card are printed from this exact build, so they always match
      # the page. If that fails (or a PDF runs past 2 pages), the copies in the repo are kept.
      - name: Install Chromium for the biodata PDFs
        run: npx playwright install --with-deps chromium

      - name: Rebuild the biodata PDFs and contact card
        run: |
          node scripts/render-biodata-assets.mjs || \
            echo "::warning title=Biodata PDFs::Rebuild failed, so the PDFs in the repo were deployed. See the log above."
        env:
          SERVE_DIR: out
          BASE_PATH: /portfolio
          DOCS_OUT: out/biodata
          ONLY: a4,vcard

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
